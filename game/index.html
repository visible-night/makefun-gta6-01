<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>Solmar City — an open-world crime game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1210;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; z-index: 10; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #minimap-wrap { top: 14px; right: 14px; width: 200px; }
  #minimap { width: 200px; height: 200px; display: block; border: 2px solid rgba(255,255,255,.6);
    border-radius: 6px; background: #0d2733; box-shadow: 0 2px 12px rgba(0,0,0,.5); }
  #minimap-label { text-align: center; font-size: 11px; letter-spacing: 3px; color: #ffd75e;
    margin-top: 3px; font-weight: 700; }
  #stats { top: 14px; left: 14px; font-weight: 700; }
  #wanted-stars { font-size: 26px; letter-spacing: 2px; color: #ffd75e; }
  #cash { font-size: 22px; color: #7ee787; margin-top: 2px; }
  #speed-box { margin-top: 6px; font-size: 15px; color: #fff; }
  #speed { font-size: 30px; font-weight: 800; }
  #health-bar { width: 170px; height: 10px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.5);
    border-radius: 5px; margin-top: 6px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: #7ee787; }
  #mission-box { left: 14px; bottom: 14px; max-width: 420px; }
  #mission-label { font-size: 11px; letter-spacing: 2px; color: #ffd75e; font-weight: 700; }
  #mission-text { font-size: 16px; margin-top: 2px; }
  #radio-label { font-size: 13px; color: #ffb3e6; margin-top: 4px; }
  #tip { font-size: 12px; color: rgba(255,255,255,.75); margin-top: 4px; }
  #toast { left: 50%; top: 84px; transform: translateX(-50%); font-size: 19px; font-weight: 700;
    color: #ffd75e; opacity: 0; transition: opacity .3s; text-align: center; white-space: nowrap; }
  #dialogue { left: 50%; bottom: 110px; transform: translateX(-50%); width: min(560px, 90vw);
    background: rgba(10,10,16,.82); border: 1px solid rgba(255,215,94,.6); border-radius: 8px;
    padding: 12px 16px; opacity: 0; transition: opacity .3s; }
  #dialogue-text { font-size: 16px; line-height: 1.45; }
  .screen { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; background: rgba(8,6,10,.45); }
  #title-screen { display: flex; background: linear-gradient(180deg, rgba(20,8,4,.25), rgba(20,8,4,.72)); }
  #title-heading { font-size: 64px; font-weight: 900; letter-spacing: 6px; color: #ffd75e;
    text-shadow: 0 3px 0 #a33d12, 0 6px 24px rgba(0,0,0,.7); }
  #title-sub { font-size: 18px; margin-top: 10px; color: #ffe9c4; max-width: 640px; line-height: 1.5; }
  #title-controls { font-size: 14px; margin-top: 22px; color: #fff; background: rgba(0,0,0,.5);
    padding: 8px 16px; border-radius: 6px; }
  .start-prompt { margin-top: 26px; font-size: 22px; font-weight: 800; color: #fff;
    animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  #dead-text { font-size: 44px; font-weight: 900; color: #ff5a4e; letter-spacing: 4px; }
  #paused-screen h2 { font-size: 40px; letter-spacing: 4px; }
  #touch { position: fixed; z-index: 15; right: 14px; bottom: 14px; display: none; gap: 8px; }
  #touch button { pointer-events: auto; width: 56px; height: 56px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.6); background: rgba(0,0,0,.45); color: #fff;
    font-size: 20px; font-weight: 800; }
  @media (pointer: coarse) { #touch { display: flex; } }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud" id="stats">
  <div id="wanted-stars">☆☆☆☆☆</div>
  <div id="cash">$120</div>
  <div id="speed-box"><span id="speed">—</span> MPH</div>
  <div id="health-bar"><div id="health-fill"></div></div>
</div>

<div class="hud" id="minimap-wrap">
  <canvas id="minimap" width="200" height="200"></canvas>
  <div id="minimap-label">SOLMAR CITY</div>
</div>

<div class="hud" id="mission-box">
  <div id="mission-label">JOB</div>
  <div id="mission-text">Talk to Rosa at the Beach Bar</div>
  <div id="radio-label"></div>
  <div id="tip"></div>
</div>

<div class="hud" id="toast"></div>
<div class="hud" id="dialogue"><div id="dialogue-text"></div></div>

<div id="touch">
  <button data-k="KeyE">E</button>
  <button data-k="Space">BRK</button>
  <button data-k="KeyH">HORN</button>
</div>

<div class="screen" id="title-screen">
  <div id="title-heading">SOLMAR CITY</div>
  <div id="title-sub"></div>
  <div id="title-controls"></div>
  <div class="start-prompt">PRESS ENTER TO START</div>
</div>
<div class="screen" id="paused-screen"><h2>PAUSED</h2><p>P to resume · M mute · R radio</p></div>
<div class="screen" id="dead-screen"><div id="dead-text">WASTED</div><p>Press Enter to start over at the Beach Bar</p></div>

<script>
  // Touch buttons emit the same key codes the keyboard path reads.
  document.querySelectorAll('#touch button').forEach((b) => {
    const down = (e) => { e.preventDefault(); window.dispatchEvent(new KeyboardEvent('keydown', { code: b.dataset.k })); };
    const up = (e) => { e.preventDefault(); window.dispatchEvent(new KeyboardEvent('keyup', { code: b.dataset.k })); };
    b.addEventListener('touchstart', down, { passive: false });
    b.addEventListener('touchend', up, { passive: false });
    b.addEventListener('mousedown', down);
    b.addEventListener('mouseup', up);
  });
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
